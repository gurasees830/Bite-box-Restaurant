<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://kit.fontawesome.com/8db4c3a748.js" crossorigin="anonymous"></script>
    <link rel="icon" type="images/x-icon" href="favicon.ico">
  </head>
  <body>
    <!-- This header section    -->
    <header>
      <nav>
        <img src="biteboxnewlogo.png" alt="BiteBox Logo" width="180" />

        <ul>
          <li><a href="Home.html" class="active">Home</a></li>
          <li><a href="Menu.html">Menu</a></li>
          <li><a href="BiteDeal.html">Bite Deals</a></li>
          <li>
            <a href="Cart.html"><i class="fa-solid fa-cart-shopping"></i></a>
          </li>
          <li>
            <a href="Login.html"><i class="fa-solid fa-user-lock"></i>Login</a>
          </li>
        </ul>
      </nav>
    </header>

    <!-- Header is closed here -->

    <section class="auth-container">
      <div class="auth-box">
        <h2>Login To Bite<span id="bibox">Box</span></h2>
        <form>
          <input type="email" placeholder="Enter Email" id="email" required />

          <div style="position: relative;">
            <input type="password" placeholder="Enter Password" id="password"required />

            <span onclick="togglepassword()" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer;">
                <i class="fa-solid fa-eye"></i>
            </span>

          </div>

          <button type="submit" onclick="login()">Login</button>
        </form>

        <p id="error" style="color: red"></p>

        <p><a href="signup.html">Forgot Password</a></p>
        <p>Don't Have an account <a href="signup.html">signup</a></p>
      </div>
    </section>
    <script src="js/script.js"></script>
  </body>
</html>
